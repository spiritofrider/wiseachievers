<section class="results-page" *ngIf="submissionExists">
  <div class="results-card">
    <p class="eyebrow">Get Your Results</p>
    <h2>Enter your email to receive your assessment results.</h2>
    <p class="results-copy">
      We have saved your answers. Enter your email ID below and click submit to
      request your results.
    </p>

    <div class="form-group">
      <label for="results-email">Email ID</label>
      <input
        id="results-email"
        type="email"
        class="form-control"
        [(ngModel)]="email"
        (blur)="markEmailTouched()"
        placeholder="name@example.com"
      />
      <p class="error-message" *ngIf="hasEmailError()">
        Enter a valid email ID before submitting.
      </p>
    </div>

    <button
      class="btn btn-primary submit-button"
      (click)="requestResults()"
      [disabled]="hasEmailError() || !email.trim()"
    >
      Submit
    </button>

    <p class="success-message" *ngIf="submitted">
      Your request has been captured. Check the console for the payload.
    </p>
  </div>
</section>
